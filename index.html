<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
"use strict";

// Utility Toast
function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

// Check WebGL Support
if (!window.THREE) {
  alert("تعذر تحميل المحرك ثلاثي الأبعاد. الرجاء التأكد من اتصال الإنترنت.");
  return;
}

// Game Setup Variables
const WORLD_SIZE = 24; // Compact size for optimized mobile memory
const MAX_HEIGHT = 16;
const BLOCK_TYPES = {
  GRASS: 0,
  DIRT: 1,
  STONE: 2,
  WOOD: 3,
  LEAVES: 4,
  SAND: 5,
  DIAMOND: 6,
  GLASS: 7
};

// Scene & Camera Init
const scene = new THREE.Scene();
const skyColorDay = new THREE.Color(0x7ec0ee);
const skyColorNight = new THREE.Color(0x0a1128);
scene.background = skyColorDay.clone();
scene.fog = new THREE.FogExp2(skyColorDay.clone(), 0.035);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 80);

// Optimized Renderer Configuration for Mid-Range Mobile
const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance",
  precision: "mediump"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25)); // Cap resolution scale
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false; // Disabled shadows for maximum mobile FPS
document.body.appendChild(renderer.domElement);

// Lighting setup
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff5ea, 0.9);
sunLight.position.set(20, 40, 20);
scene.add(sunLight);

// Procedural Pixel Textures Generation for Maximum Efficiency & Low Draw Calls
function generatePixelTexture(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');

  let baseColor, spotColor;
  switch (type) {
    case BLOCK_TYPES.GRASS: baseColor = '#5bb343'; spotColor = '#4a9c34'; break;
    case BLOCK_TYPES.DIRT: baseColor = '#835434'; spotColor = '#6b4226'; break;
    case BLOCK_TYPES.STONE: baseColor = '#808080'; spotColor = '#666666'; break;
    case BLOCK_TYPES.WOOD: baseColor = '#8d5b32'; spotColor = '#6b4322'; break;
    case BLOCK_TYPES.LEAVES: baseColor = '#388e3c'; spotColor = '#2e7d32'; break;
    case BLOCK_TYPES.SAND: baseColor = '#e3c270'; spotColor = '#d4b15b'; break;
    case BLOCK_TYPES.DIAMOND: baseColor = '#42e3d0'; spotColor = '#20b2aa'; break;
    case BLOCK_TYPES.GLASS: baseColor = '#a0d8ef'; spotColor = '#ffffff'; break;
    default: baseColor = '#ffffff'; spotColor = '#cccccc';
  }

  ctx.fillStyle = baseColor;
  ctx.fillRect(0, 0, 16, 16);

  // Add random pixels for texture detail
  for (let x = 0; x < 16; x++) {
    for (let y = 0; y < 16; y++) {
      if (Math.random() > 0.65) {
        ctx.fillStyle = spotColor;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  // Top border highlight for grass
  if (type === BLOCK_TYPES.GRASS) {
    ctx.fillStyle = '#6ec754';
    ctx.fillRect(0, 0, 16, 3);
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  return texture;
}

// Materials setup
const blockMaterials = [];
Object.values(BLOCK_TYPES).forEach(type => {
  const isGlass = (type === BLOCK_TYPES.GLASS);
  blockMaterials[type] = new THREE.MeshLambertMaterial({
    map: generatePixelTexture(type),
    transparent: isGlass || type === BLOCK_TYPES.LEAVES,
    opacity: isGlass ? 0.6 : 1.0,
    alphaTest: type === BLOCK_TYPES.LEAVES ? 0.2 : 0.0
  });
});

// Voxel Storage & InstancedMesh Batching Strategy
const voxelGrid = new Map(); // key: "x,y,z" -> type
const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
const instancedMeshes = [];
const dummy = new THREE.Object3D();

function getKey(x, y, z) { return `${x},${y},${z}`; }

// Initialize terrain
function buildTerrain() {
  const savedWorld = localStorage.getItem("imadcraft_mobile_save_v1");
  voxelGrid.clear();

  if (savedWorld) {
    try {
      const data = JSON.parse(savedWorld);
      data.forEach(item => voxelGrid.set(getKey(item.x, item.y, item.z), item.t));
      rebuildInstancedMeshes();
      return;
    } catch(e) { console.warn("Failed to load save:", e); }
  }

  // Generate Natural Terrain
  const half = Math.floor(WORLD_SIZE / 2);
  for (let x = -half; x <= half; x++) {
    for (let z = -half; z <= half; z++) {
      // Simple terrain height function using math sine/cosine
      const h = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 2.5) + 2;
      
      voxelGrid.set(getKey(x, -1, z), BLOCK_TYPES.BEDROCK || BLOCK_TYPES.STONE);
      for (let y = 0; y <= h; y++) {
        let type = BLOCK_TYPES.DIRT;
        if (y === h) type = BLOCK_TYPES.GRASS;
        else if (y < h - 2) type = BLOCK_TYPES.STONE;
        voxelGrid.set(getKey(x, y, z), type);
      }

      // Procedural Trees Placement
      if (Math.random() < 0.035 && Math.abs(x) > 3 && Math.abs(z) > 3) {
        const treeY = h + 1;
        for (let trunk = 0; trunk < 4; trunk++) {
          voxelGrid.set(getKey(x, treeY + trunk, z), BLOCK_TYPES.WOOD);
        }
        for (let lx = -1; lx <= 1; lx++) {
          for (let lz = -1; lz <= 1; lz++) {
            for (let ly = 3; ly <= 4; ly++) {
              if (lx === 0 && lz === 0 && ly === 3) continue;
              voxelGrid.set(getKey(x + lx, treeY + ly, z + lz), BLOCK_TYPES.LEAVES);
            }
          }
        }
      }
    }
  }

  rebuildInstancedMeshes();
}

// Rebuild Instanced Meshes to keep Draw Calls under ~10
function rebuildInstancedMeshes() {
  instancedMeshes.forEach(mesh => scene.remove(mesh));
  instancedMeshes.length = 0;

  // Group positions by block type
  const typeGroups = {};
  Object.values(BLOCK_TYPES).forEach(t => typeGroups[t] = []);

  voxelGrid.forEach((type, key) => {
    const [x, y, z] = key.split(',').map(Number);
    if (typeGroups[type]) {
      typeGroups[type].push({ x, y, z });
    }
  });

  // Create InstancedMesh per type
  Object.keys(typeGroups).forEach(typeStr => {
    const type = parseInt(typeStr);
    const blocks = typeGroups[type];
    if (blocks.length === 0) return;

    const instMesh = new THREE.InstancedMesh(blockGeometry, blockMaterials[type], blocks.length);
    for (let i = 0; i < blocks.length; i++) {
      dummy.position.set(blocks[i].x, blocks[i].y, blocks[i].z);
      dummy.updateMatrix();
      instMesh.setMatrixAt(i, dummy.matrix);
    }
    instMesh.instanceMatrix.needsUpdate = true;
    instMesh.userData = { type, blocks };
    scene.add(instMesh);
    instancedMeshes.push(instMesh);
  });
}

function saveWorld() {
  const data = [];
  voxelGrid.forEach((t, k) => {
    const [x, y, z] = k.split(',').map(Number);
    data.push({ x, y, z, t });
  });
  localStorage.setItem("imadcraft_mobile_save_v1", JSON.stringify(data));
  showToast("تم حفظ العالم!");
}

// Floating Procedural Volumetric Clouds
const cloudGroup = new THREE.Group();
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
const cloudGeo = new THREE.BoxGeometry(1, 0.8, 1);

for (let c = 0; c < 8; c++) {
  const cloudMesh = new THREE.Group();
  const cx = (Math.random() - 0.5) * 60;
  const cz = (Math.random() - 0.5) * 60;
  const cy = 18 + Math.random() * 4;

  for (let bx = 0; bx < 4 + Math.floor(Math.random()*4); bx++) {
    for (let bz = 0; bz < 3 + Math.floor(Math.random()*3); bz++) {
      const b = new THREE.Mesh(cloudGeo, cloudMat);
      b.position.set(bx, 0, bz);
      cloudMesh.add(b);
    }
  }
  cloudMesh.position.set(cx, cy, cz);
  cloudGroup.add(cloudMesh);
}
scene.add(cloudGroup);

// Low-Poly Animated Animals (Pig Mobs)
class Mob {
  constructor(x, z) {
    this.group = new THREE.Group();
    
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xf48fb1 }); // Pink Pig
    
    // Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.8, 1.4), skinMat);
    body.position.y = 0.6;
    this.group.add(body);

    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), skinMat);
    head.position.set(0, 0.9, 0.8);
    this.group.add(head);

    // Snout
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.2), new THREE.MeshLambertMaterial({ color: 0xe91e63 }));
    snout.position.set(0, 0.8, 1.15);
    this.group.add(snout);

    // Legs
    const legGeo = new THREE.BoxGeometry(0.3, 0.5, 0.3);
    this.legs = [];
    const offsets = [
      [-0.35, 0.25, 0.4], [0.35, 0.25, 0.4],
      [-0.35, 0.25, -0.4], [0.35, 0.25, -0.4]
    ];
    offsets.forEach(off => {
      const leg = new THREE.Mesh(legGeo, skinMat);
      leg.position.set(...off);
      this.group.add(leg);
      this.legs.push(leg);
    });

    this.group.position.set(x, 1, z);
    scene.add(this.group);

    this.vx = (Math.random() - 0.5) * 0.8;
    this.vz = (Math.random() - 0.5) * 0.8;
    this.changeTimer = 0;
  }

  update(dt, now) {
    this.changeTimer -= dt;
    if (this.changeTimer <= 0) {
      this.vx = (Math.random() - 0.5) * 1.2;
      this.vz = (Math.random() - 0.5) * 1.2;
      this.changeTimer = 2 + Math.random() * 3;
    }

    const nextX = this.group.position.x + this.vx * dt;
    const nextZ = this.group.position.z + this.vz * dt;

    // Boundaries check
    if (Math.abs(nextX) < WORLD_SIZE / 2 - 1) this.group.position.x = nextX;
    if (Math.abs(nextZ) < WORLD_SIZE / 2 - 1) this.group.position.z = nextZ;

    // Rotation
    if (Math.abs(this.vx) > 0.05 || Math.abs(this.vz) > 0.05) {
      const angle = Math.atan2(this.vx, this.vz);
      this.group.rotation.y = angle;

      // Leg swing animation
      const legSwing = Math.sin(now * 8) * 0.4;
      this.legs[0].rotation.x = legSwing;
      this.legs[1].rotation.x = -legSwing;
      this.legs[2].rotation.x = -legSwing;
      this.legs[3].rotation.x = legSwing;
    }
  }
}

const mobs = [new Mob(-4, 4), new Mob(5, -5)];

// Player & Camera Physics State
const player = {
  x: 0, y: 5, z: 5,
  vy: 0,
  grounded: false
};

let yaw = 0;
let pitch = -0.2;
let thirdPerson = false;
let selectedBlockType = BLOCK_TYPES.GRASS;

// D-Pad Direction State
const moveDir = { forward: 0, right: 0 };

// Bind Touch D-Pad with smooth multi-touch response
function bindDPadBtn(id, forwardVal, rightVal) {
  const el = document.getElementById(id);
  const start = (e) => {
    e.preventDefault();
    el.classList.add("pressed");
    if (forwardVal !== 0) moveDir.forward = forwardVal;
    if (rightVal !== 0) moveDir.right = rightVal;
  };
  const end = (e) => {
    e.preventDefault();
    el.classList.remove("pressed");
    if (forwardVal !== 0 && moveDir.forward === forwardVal) moveDir.forward = 0;
    if (rightVal !== 0 && moveDir.right === rightVal) moveDir.right = 0;
  };

  el.addEventListener("touchstart", start, { passive: false });
  el.addEventListener("touchend", end, { passive: false });
  el.addEventListener("touchcancel", end, { passive: false });
  el.addEventListener("mousedown", start);
  el.addEventListener("mouseup", end);
}

bindDPadBtn("btn-up", 1, 0);
bindDPadBtn("btn-down", -1, 0);
bindDPadBtn("btn-left", 0, -1);
bindDPadBtn("btn-right", 0, 1);

// Action Controls
const btnJump = document.getElementById("btn-jump");
const triggerJump = (e) => {
  e.preventDefault();
  if (player.grounded) {
    player.vy = 8.2;
    player.grounded = false;
  }
};
btnJump.addEventListener("touchstart", triggerJump, { passive: false });
btnJump.addEventListener("mousedown", triggerJump);

// Smooth Touch Camera Drag System
let activeLookTouchId = null;
let lastTouchX = 0, lastTouchY = 0;

window.addEventListener("touchstart", (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    // Ignore touches on interactive UI buttons
    if (!touch.target.closest(".interactive-ctrl") && !touch.target.closest("#top-actions")) {
      if (activeLookTouchId === null) {
        activeLookTouchId = touch.identifier;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }
  }
}, { passive: false });

window.addEventListener("touchmove", (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const touch = e.changedTouches[i];
    if (touch.identifier === activeLookTouchId) {
      const dx = touch.clientX - lastTouchX;
      const dy = touch.clientY - lastTouchY;
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;

      yaw -= dx * 0.005;
      pitch -= dy * 0.005;
      pitch = Math.max(-1.3, Math.min(1.3, pitch)); // Clamp vertical look
    }
  }
}, { passive: false });

const clearTouchLook = (e) => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === activeLookTouchId) {
      activeLookTouchId = null;
    }
  }
};
window.addEventListener("touchend", clearTouchLook);
window.addEventListener("touchcancel", clearTouchLook);

// Mouse fallback for desktop testing
let isMouseDown = false;
window.addEventListener("mousedown", (e) => {
  if (!e.target.closest(".interactive-ctrl") && !e.target.closest("#top-actions")) {
    isMouseDown = true;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
});
window.addEventListener("mousemove", (e) => {
  if (isMouseDown) {
    const dx = e.clientX - lastTouchX;
    const dy = e.clientY - lastTouchY;
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
    yaw -= dx * 0.004;
    pitch = Math.max(-1.3, Math.min(1.3, pitch - dy * 0.004));
  }
});
window.addEventListener("mouseup", () => isMouseDown = false);

// Hotbar selection logic
document.querySelectorAll(".hotbar-slot").forEach(slot => {
  const selectSlot = (e) => {
    e.preventDefault();
    document.querySelectorAll(".hotbar-slot").forEach(s => s.classList.remove("active"));
    slot.classList.add("active");
    selectedBlockType = parseInt(slot.getAttribute("data-type"));
  };
  slot.addEventListener("touchstart", selectSlot, { passive: false });
  slot.addEventListener("click", selectSlot);
});

// Top Action Buttons
document.getElementById("btn-camera").addEventListener("click", () => {
  thirdPerson = !thirdPerson;
  document.getElementById("btn-camera").textContent = thirdPerson ? "👤 المنظور: الثالث" : "👤 المنظور: الأول";
});

document.getElementById("btn-save").addEventListener("click", () => saveWorld());

document.getElementById("btn-reset").addEventListener("click", () => {
  if (confirm("هل تريد إعادة بناء العالم؟ سيتم مسح التغييرات الحالية.")) {
    localStorage.removeItem("imadcraft_mobile_save_v1");
    buildTerrain();
    showToast("تم إنشاء عالم جديد!");
  }
});

// Raycasting for Breaking and Placing Blocks
const raycaster = new THREE.Raycaster();
const screenCenter = new THREE.Vector2(0, 0);

function getTargetedBlock() {
  raycaster.setFromCamera(screenCenter, camera);
  const intersects = raycaster.intersectObjects(instancedMeshes, false);
  if (intersects.length > 0 && intersects[0].distance < 6.5) {
    const hit = intersects[0];
    const instanceId = hit.instanceId;
    const instMesh = hit.object;
    const blockData = instMesh.userData.blocks[instanceId];
    return { hit, blockData, instMesh };
  }
  return null;
}

// Break Block
const btnBreak = document.getElementById("btn-break");
const triggerBreak = (e) => {
  e.preventDefault();
  const target = getTargetedBlock();
  if (target) {
    const { x, y, z } = target.blockData;
    voxelGrid.delete(getKey(x, y, z));
    rebuildInstancedMeshes();
  }
};
btnBreak.addEventListener("touchstart", triggerBreak, { passive: false });
btnBreak.addEventListener("click", triggerBreak);

// Place Block
const btnBuild = document.getElementById("btn-build");
const triggerBuild = (e) => {
  e.preventDefault();
  const target = getTargetedBlock();
  if (target) {
    const normal = target.hit.face.normal;
    const { x, y, z } = target.blockData;
    const px = x + Math.round(normal.x);
    const py = y + Math.round(normal.y);
    const pz = z + Math.round(normal.z);

    // Player collision safety check
    const playerBlockX = Math.round(player.x);
    const playerBlockZ = Math.round(player.z);
    if (px === playerBlockX && pz === playerBlockZ && (py === Math.floor(player.y) || py === Math.floor(player.y) + 1)) {
      return;
    }

    if (py >= 0 && py < MAX_HEIGHT) {
      voxelGrid.set(getKey(px, py, pz), selectedBlockType);
      rebuildInstancedMeshes();
    }
  }
};
btnBuild.addEventListener("touchstart", triggerBuild, { passive: false });
btnBuild.addEventListener("click", triggerBuild);

// Initialize World
buildTerrain();

// Main Game Engine Loop
let lastTime = performance.now();
let dayCycleTime = 0;

function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min((now - lastTime) / 1000, 0.05); // Cap delta time
  lastTime = now;

  // Player Movement & Physics
  const speed = 5.5;
  if (moveDir.forward !== 0 || moveDir.right !== 0) {
    const forwardX = -Math.sin(yaw);
    const forwardZ = Math.cos(yaw);
    const rightX = Math.cos(yaw);
    const rightZ = Math.sin(yaw);

    const moveX = (forwardX * moveDir.forward + rightX * moveDir.right) * speed * dt;
    const moveZ = (forwardZ * moveDir.forward + rightZ * moveDir.right) * speed * dt;

    player.x += moveX;
    player.z += moveZ;
  }

  // Gravity Physics
  player.vy -= 22 * dt;
  player.y += player.vy * dt;

  // Collision with ground voxel height check
  const px = Math.round(player.x);
  const pz = Math.round(player.z);
  let groundY = 0;
  for (let y = MAX_HEIGHT; y >= 0; y--) {
    if (voxelGrid.has(getKey(px, y, pz))) {
      groundY = y + 1;
      break;
    }
  }

  if (player.y <= groundY) {
    player.y = groundY;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  // Camera Position Logic
  const eyeY = player.y + 1.5;
  if (thirdPerson) {
    const dist = 3.8;
    camera.position.set(
      player.x + Math.sin(yaw) * dist * Math.cos(pitch),
      eyeY - Math.sin(pitch) * dist,
      player.z - Math.cos(yaw) * dist * Math.cos(pitch)
    );
    camera.lookAt(player.x, eyeY, player.z);
  } else {
    camera.position.set(player.x, eyeY, player.z);
    const targetX = player.x - Math.sin(yaw) * Math.cos(pitch);
    const targetY = eyeY + Math.sin(pitch);
    const targetZ = player.z + Math.cos(yaw) * Math.cos(pitch);
    camera.lookAt(targetX, targetY, targetZ);
  }

  // Day / Night Environment Cycle
  dayCycleTime += dt * 0.03;
  const sunAngle = dayCycleTime;
  sunLight.position.x = Math.cos(sunAngle) * 40;
  sunLight.position.y = Math.sin(sunAngle) * 40;
  
  const dayFactor = Math.max(0, Math.sin(sunAngle));
  scene.background.lerpColors(skyColorNight, skyColorDay, dayFactor);
  scene.fog.color.copy(scene.background);

  // Cloud Drift
  cloudGroup.children.forEach(c => {
    c.position.x += dt * 0.4;
    if (c.position.x > 35) c.position.x = -35;
  });

  // Mobs Update
  mobs.forEach(mob => mob.update(dt, now / 1000));

  renderer.render(scene, camera);
}

// Window Resize Handling
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start Engine
requestAnimationFrame(gameLoop);

})();
</script>
