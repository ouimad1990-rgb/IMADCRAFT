<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

/* ==================== CONFIG ==================== */
const CHUNK_SIZE = 16;
const WORLD_HEIGHT = 40;
const AIR = 255;

const BLOCK = { GRASS: 0, DIRT: 1, STONE: 2, WOOD: 3, LEAVES: 4, SAND: 5, DIAMOND: 6, GLASS: 7, BEDROCK: 8 };
// ✅ إصلاح #7: بلوك bedrock حقيقي

const blockColors = {
  [BLOCK.GRASS]: 0x52b748, [BLOCK.DIRT]: 0x8c5830, [BLOCK.STONE]: 0x858585,
  [BLOCK.WOOD]: 0x966133, [BLOCK.LEAVES]: 0x2e8b34, [BLOCK.SAND]: 0xebd686,
  [BLOCK.DIAMOND]: 0x33e1d6, [BLOCK.GLASS]: 0xa8e1f5, [BLOCK.BEDROCK]: 0x1a1a1a,
};

const PLAYER = { width: 0.6, height: 1.8, eye: 1.62, gravity: 26, jumpVel: 8.2, baseSpeed: 5.0 };

const gameSettings = { sensitivity: 5, moveSpeed: 5, renderDistance: 3, quality: 100, fog: true, showFps: true, volume: 80 };

/* ==================== STATE ==================== */
let selectedBlockType = BLOCK.GRASS;
let cameraMode = 0;
let isGameStarted = false;
let hasUnsavedChanges = false;
let settingsReturnTo = "main";
let yaw = 0, pitch = 0;

const player = { pos: new THREE.Vector3(8, 25, 8), vel: new THREE.Vector3(), onGround: false };
const moveState = { forward: 0, backward: 0, left: 0, right: 0, jump: false };

const chunks = new Map();
const genQueue = [];
const chunkMods = new Map();

/* ==================== UTILS ==================== */
function showToast(text) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hash(x, z) { const h = Math.sin(x * 127.1 + z * 311.7 + 0.5) * 43758.5453; return h - Math.floor(h); }
function noise2D(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const a = hash(xi, zi), b = hash(xi+1, zi), c = hash(xi, zi+1), d = hash(xi+1, zi+1);
  const u = xf*xf*(3-2*xf), v = zf*zf*(3-2*zf);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function terrainHeight(x, z) {
  let h = 0;
  h += noise2D(x*0.02, z*0.02) * 10;
  h += noise2D(x*0.06, z*0.06) * 4;
  h += noise2D(x*0.15, z*0.15) * 2;
  return Math.floor(h) + 15;
}

/* ==================== CHUNK ==================== */
class Chunk {
  constructor(cx, cz) {
    this.cx = cx; this.cz = cz;
    this.blocks = new Uint8Array(CHUNK_SIZE * WORLD_HEIGHT * CHUNK_SIZE).fill(AIR);
    this.meshes = [];
    this.instanced = {};
  }
  idx(lx, ly, lz) { return lx + lz * CHUNK_SIZE + ly * CHUNK_SIZE * CHUNK_SIZE; }
  get(lx, ly, lz) {
    if (lx<0||lx>=CHUNK_SIZE||lz<0||lz>=CHUNK_SIZE||ly<0||ly>=WORLD_HEIGHT) return AIR;
    return this.blocks[this.idx(lx, ly, lz)];
  }
  set(lx, ly, lz, t) {
    if (lx<0||lx>=CHUNK_SIZE||lz<0||lz>=CHUNK_SIZE||ly<0||ly>=WORLD_HEIGHT) return;
    this.blocks[this.idx(lx, ly, lz)] = t;
  }
}

/* ==================== WORLD ACCESS ==================== */
function worldToChunk(x, z) {
  return { cx: Math.floor(x/CHUNK_SIZE), cz: Math.floor(z/CHUNK_SIZE),
           lx: ((x%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE, lz: ((z%CHUNK_SIZE)+CHUNK_SIZE)%CHUNK_SIZE };
}
function getBlockAt(x, y, z) {
  if (y<0||y>=WORLD_HEIGHT) return AIR;
  const c = worldToChunk(x, z);
  const chunk = chunks.get(`${c.cx},${c.cz}`);
  if (!chunk) return AIR;
  return chunk.get(c.lx, y, c.lz);
}
function isSolid(t) { return t !== AIR; }

function setBlockAt(x, y, z, type) {
  if (y<0||y>=WORLD_HEIGHT) return false;
  const c = worldToChunk(x, z);
  const key = `${c.cx},${c.cz}`;
  const chunk = chunks.get(key);
  if (!chunk) return false;
  const old = chunk.get(c.lx, y, c.lz);
  if (old === type) return false;
  chunk.set(c.lx, y, c.lz, type);
  if (!chunkMods.has(key)) chunkMods.set(key, new Map());
  chunkMods.get(key).set(`${c.lx},${y},${c.lz}`, type);
  hasUnsavedChanges = true;
  rebuildChunk(chunk);

  // ✅ إصلاح #4: أعد بناء القطع المجاورة عند تعديل بلوك على الحدود
  if (c.lx === 0) { const nb = chunks.get(`${c.cx-1},${c.cz}`); if (nb) rebuildChunk(nb); }
  if (c.lx === CHUNK_SIZE-1) { const nb = chunks.get(`${c.cx+1},${c.cz}`); if (nb) rebuildChunk(nb); }
  if (c.lz === 0) { const nb = chunks.get(`${c.cx},${c.cz-1}`); if (nb) rebuildChunk(nb); }
  if (c.lz === CHUNK_SIZE-1) { const nb = chunks.get(`${c.cx},${c.cz+1}`); if (nb) rebuildChunk(nb); }
  return true;
}

/* ==================== TERRAIN GEN ==================== */
function generateChunk(chunk) {
  const baseX = chunk.cx * CHUNK_SIZE;
  const baseZ = chunk.cz * CHUNK_SIZE;
  for (let lx = 0; lx < CHUNK_SIZE; lx++) {
    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
      const wx = baseX + lx, wz = baseZ + lz;
      const h = clamp(terrainHeight(wx, wz), 1, WORLD_HEIGHT - 6);
      // ✅ إصلاح #7: طبقة bedrock صلبة في y=0
      chunk.set(lx, 0, lz, BLOCK.BEDROCK);
      for (let y = 1; y <= h; y++) {
        let t;
        if (y === h) t = (h < 13) ? BLOCK.SAND : BLOCK.GRASS;
        else if (y >= h - 2) t = (h < 13) ? BLOCK.SAND : BLOCK.DIRT;
        else t = BLOCK.STONE;
        if (y < 4 && hash(wx*3 + y, wz*3) > 0.97) t = BLOCK.DIAMOND;
        chunk.set(lx, y, lz, t);
      }
      if (h > 13 && h < WORLD_HEIGHT - 8 && lx >= 3 && lx <= 12 && lz >= 3 && lz <= 12) {
        const seed = hash(wx*12.9898, wz*78.233);
        if (seed > 0.985) {
          const th = 4 + Math.floor(hash(wx, wz) * 2);
          for (let ty = 1; ty <= th; ty++) chunk.set(lx, h+ty, lz, BLOCK.WOOD);
          const ly = h + th;
          for (let dx = -2; dx <= 2; dx++) for (let dz = -2; dz <= 2; dz++) for (let dy = -1; dy <= 2; dy++) {
            if (Math.abs(dx)===2 && Math.abs(dz)===2) continue;
            if (dx===0 && dz===0 && dy<=0) continue;
            const nx=lx+dx, nz=lz+dz, ny=ly+dy;
            if (nx<0||nx>=CHUNK_SIZE||nz<0||nz>=CHUNK_SIZE||ny>=WORLD_HEIGHT) continue;
            if (chunk.get(nx,ny,nz) === AIR) chunk.set(nx,ny,nz, BLOCK.LEAVES);
          }
        }
      }
    }
  }
  // تطبيق التعديلات المحفوظة على هذه القطعة
  const key = `${chunk.cx},${chunk.cz}`;
  const mods = chunkMods.get(key);
  if (mods) for (const [bkey, t] of mods) {
    const [lx, ly, lz] = bkey.split(',').map(Number);
    chunk.set(lx, ly, lz, t);
  }
}

/* ==================== MESHING ==================== */
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const materials = {};
Object.keys(blockColors).forEach(type => {
  const isGlass = parseInt(type) === BLOCK.GLASS;
  materials[type] = new THREE.MeshLambertMaterial({
    color: blockColors[type], transparent: isGlass,
    opacity: isGlass ? 0.55 : 1, depthWrite: !isGlass
  });
});

// ✅ إصلاح #3: افحص البلوكات المجاورة عبر حدود القطع (يمنع z-fighting)
function isExposedInChunk(chunk, lx, ly, lz) {
  const wx = chunk.cx * CHUNK_SIZE + lx;
  const wz = chunk.cz * CHUNK_SIZE + lz;
  return !isSolid(getBlockAt(wx+1, ly, wz)) ||
         !isSolid(getBlockAt(wx-1, ly, wz)) ||
         !isSolid(getBlockAt(wx, ly+1, wz)) ||
         !isSolid(getBlockAt(wx, ly-1, wz)) ||
         !isSolid(getBlockAt(wx, ly, wz+1)) ||
         !isSolid(getBlockAt(wx, ly, wz-1));
}

const _m4 = new THREE.Matrix4();

function rebuildChunk(chunk) {
  for (const m of chunk.meshes) { scene.remove(m); m.dispose(); }
  chunk.meshes = []; chunk.instanced = {};

  const groups = {};
  for (let lx = 0; lx < CHUNK_SIZE; lx++)
    for (let ly = 0; ly < WORLD_HEIGHT; ly++)
      for (let lz = 0; lz < CHUNK_SIZE; lz++) {
        const t = chunk.get(lx, ly, lz);
        if (t === AIR) continue;
        if (!isExposedInChunk(chunk, lx, ly, lz)) continue;
        if (!groups[t]) groups[t] = [];
        groups[t].push([lx, ly, lz]);
      }

  const baseX = chunk.cx * CHUNK_SIZE, baseZ = chunk.cz * CHUNK_SIZE;
  for (const tStr in groups) {
    const list = groups[tStr];
    if (!materials[tStr]) continue;
    const mesh = new THREE.InstancedMesh(boxGeo, materials[tStr], list.length);
    mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    for (let i = 0; i < list.length; i++) {
      const [lx, ly, lz] = list[i];
      _m4.makeTranslation(baseX+lx+0.5, ly+0.5, baseZ+lz+0.5);
      mesh.setMatrixAt(i, _m4);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = true;
    scene.add(mesh);
    chunk.meshes.push(mesh);
    chunk.instanced[tStr] = mesh;
  }
}

/* ==================== CHUNK MGMT ==================== */
function rebuildChunkNeighbors(cx, cz) {
  // ✅ إصلاح #3 (تكملة): عند تحميل قطعة جديدة، أعد بناء جيرانها
  for (const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
    const nb = chunks.get(`${cx+dx},${cz+dz}`);
    if (nb) rebuildChunk(nb);
  }
}

function requestChunksAround(px, pz) {
  const pcx = Math.floor(px/CHUNK_SIZE), pcz = Math.floor(pz/CHUNK_SIZE);
  const R = gameSettings.renderDistance;
  for (let dx = -R; dx <= R; dx++) for (let dz = -R; dz <= R; dz++) {
    const cx = pcx+dx, cz = pcz+dz, key = `${cx},${cz}`;
    if (chunks.has(key) || genQueue.some(q => q.key === key)) continue;
    genQueue.push({ key, cx, cz });
  }
  for (const [key, chunk] of chunks) {
    if (Math.abs(chunk.cx-pcx) > R+1 || Math.abs(chunk.cz-pcz) > R+1) {
      for (const m of chunk.meshes) { scene.remove(m); m.dispose(); }
      chunks.delete(key);
    }
  }
}
function processGenQueue(budgetMs) {
  if (genQueue.length === 0) return;
  const pcx = Math.floor(player.pos.x/CHUNK_SIZE), pcz = Math.floor(player.pos.z/CHUNK_SIZE);
  genQueue.sort((a,b) =>
    Math.max(Math.abs(a.cx-pcx),Math.abs(a.cz-pcz)) - Math.max(Math.abs(b.cx-pcx),Math.abs(b.cz-pcz)));
  const start = performance.now();
  while (genQueue.length > 0 && performance.now() - start < budgetMs) {
    const item = genQueue.shift();
    if (chunks.has(item.key)) continue;
    const chunk = new Chunk(item.cx, item.cz);
    generateChunk(chunk); rebuildChunk(chunk);
    chunks.set(item.key, chunk);
    rebuildChunkNeighbors(item.cx, item.cz);
  }
}
function forceGenerateChunk(cx, cz) {
  const key = `${cx},${cz}`;
  if (chunks.has(key)) return;
  const chunk = new Chunk(cx, cz);
  generateChunk(chunk); rebuildChunk(chunk);
  chunks.set(key, chunk);
  rebuildChunkNeighbors(cx, cz);
}

/* ==================== THREE SETUP ==================== */
const scene = new THREE.Scene();
const skyColorDay = new THREE.Color(0x88ccff);
scene.background = skyColorDay.clone();

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 200);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", precision: "mediump" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sunLight = new THREE.DirectionalLight(0xfffaee, 0.9);
sunLight.position.set(50, 80, 30);
scene.add(sunLight);
const backLight = new THREE.DirectionalLight(0x88bbff, 0.25);
backLight.position.set(-30, 20, -40);
scene.add(backLight);

function applyFog() {
  if (gameSettings.fog) {
    const dist = gameSettings.renderDistance * CHUNK_SIZE;
    scene.fog = new THREE.Fog(skyColorDay, dist*0.55, dist*1.05);
  } else scene.fog = null;
}
applyFog();

/* ==================== COLLISION ==================== */
function playerCollides(px, py, pz) {
  const hw = PLAYER.width/2;
  const x0=px-hw, x1=px+hw, y0=py, y1=py+PLAYER.height, z0=pz-hw, z1=pz+hw;
  const bx0=Math.floor(x0), bx1=Math.floor(x1-0.0001);
  const by0=Math.floor(y0), by1=Math.floor(y1-0.0001);
  const bz0=Math.floor(z0), bz1=Math.floor(z1-0.0001);
  for (let bx=bx0; bx<=bx1; bx++) for (let by=by0; by<=by1; by++) for (let bz=bz0; bz<=bz1; bz++) {
    if (isSolid(getBlockAt(bx,by,bz))) {
      if (x1>bx && x0<bx+1 && y1>by && y0<by+1 && z1>bz && z0<bz+1) return true;
    }
  }
  return false;
}
function blockWouldHitPlayer(bx, by, bz) {
  const hw = PLAYER.width/2;
  return (player.pos.x+hw>bx && player.pos.x-hw<bx+1 &&
          player.pos.y+PLAYER.height>by && player.pos.y<by+1 &&
          player.pos.z+hw>bz && player.pos.z-hw<bz+1);
}

/* ==================== PLAYER UPDATE ==================== */
function updatePlayer(dt) {
  player.vel.y -= PLAYER.gravity * dt;
  if (player.vel.y < -30) player.vel.y = -30;

  const fwd = (moveState.forward?1:0) - (moveState.backward?1:0);
  const str = (moveState.right?1:0) - (moveState.left?1:0);
  const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
  const dx = -sinY*fwd + cosY*str;
  const dz = -cosY*fwd - sinY*str;
  const len = Math.hypot(dx, dz);
  const spd = PLAYER.baseSpeed * (gameSettings.moveSpeed/5);
  if (len > 0) { player.vel.x = (dx/len)*spd; player.vel.z = (dz/len)*spd; }
  else { player.vel.x = 0; player.vel.z = 0; }

  if (moveState.jump && player.onGround) { player.vel.y = PLAYER.jumpVel; player.onGround = false; }

  const nx = player.pos.x + player.vel.x*dt;
  if (!playerCollides(nx, player.pos.y, player.pos.z)) player.pos.x = nx; else player.vel.x = 0;
  const nz = player.pos.z + player.vel.z*dt;
  if (!playerCollides(player.pos.x, player.pos.y, nz)) player.pos.z = nz; else player.vel.z = 0;

  const ny = player.pos.y + player.vel.y*dt;
  if (!playerCollides(player.pos.x, ny, player.pos.z)) {
    player.pos.y = ny;
    if (player.vel.y < 0) player.onGround = false;
  } else {
    if (player.vel.y < 0) {
      player.pos.y = Math.ceil(player.pos.y);
      let guard = 0;
      while (playerCollides(player.pos.x, player.pos.y, player.pos.z) && guard++ < 5) player.pos.y += 0.05;
      player.onGround = true;
    } else {
      player.pos.y = Math.floor(player.pos.y + PLAYER.height) - PLAYER.height - 0.001;
    }
    player.vel.y = 0;
  }
  if (!player.onGround && player.vel.y <= 0) {
    if (playerCollides(player.pos.x, player.pos.y - 0.05, player.pos.z)) {
      player.onGround = true;
      player.pos.y = Math.ceil(player.pos.y);
    }
  }
  if (player.pos.y < -10) { player.pos.y = 30; player.vel.set(0,0,0); }
}

/* ==================== CAMERA ==================== */
function updateCamera() {
  const eyeY = player.pos.y + PLAYER.eye;
  if (cameraMode === 0) {
    camera.position.set(player.pos.x, eyeY, player.pos.z);
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
    camera.rotation.z = 0;
  } else {
    // ✅ إصلاح #5: كاميرا الشخص الثالث تتبع اتجاه النظر بشكل صحيح
    const dist = 4.5;
    const cosP = Math.cos(pitch);
    const backX = Math.sin(yaw) * dist * cosP;
    const backZ = Math.cos(yaw) * dist * cosP;
    const backY = Math.sin(pitch) * dist;
    let cx = player.pos.x + backX;
    let cy = eyeY - backY + 0.3;
    let cz = player.pos.z + backZ;
    const origin = new THREE.Vector3(player.pos.x, eyeY, player.pos.z);
    const dir = new THREE.Vector3(cx-origin.x, cy-origin.y, cz-origin.z);
    const distFull = dir.length();
    if (distFull > 0.001) {
      dir.normalize();
      const hit = raycastVoxel(origin, dir, distFull);
      if (hit) {
        const safe = Math.max(0.5, hit.dist - 0.3);
        // ✅ إصلاح #6: إزالة الكود الميت `const t = safe / distFull`
        cx = origin.x + dir.x * safe;
        cy = origin.y + dir.y * safe;
        cz = origin.z + dir.z * safe;
      }
    }
    camera.position.set(cx, cy, cz);
    camera.lookAt(player.pos.x, eyeY, player.pos.z);
  }
}

/* ==================== RAYCAST ==================== */
function raycastVoxel(origin, dir, maxDist) {
  let x = Math.floor(origin.x), y = Math.floor(origin.y), z = Math.floor(origin.z);
  const stepX = dir.x > 0 ? 1 : -1;
  const stepY = dir.y > 0 ? 1 : -1;
  const stepZ = dir.z > 0 ? 1 : -1;
  const tDeltaX = dir.x !== 0 ? Math.abs(1/dir.x) : Infinity;
  const tDeltaY = dir.y !== 0 ? Math.abs(1/dir.y) : Infinity;
  const tDeltaZ = dir.z !== 0 ? Math.abs(1/dir.z) : Infinity;
  let tMaxX = dir.x !== 0 ? Math.abs((x + (stepX>0?1:0) - origin.x)/dir.x) : Infinity;
  let tMaxY = dir.y !== 0 ? Math.abs((y + (stepY>0?1:0) - origin.y)/dir.y) : Infinity;
  let tMaxZ = dir.z !== 0 ? Math.abs((z + (stepZ>0?1:0) - origin.z)/dir.z) : Infinity;
  let nx = 0, ny = 0, nz = 0, t = 0;
  while (t < maxDist) {
    if (isSolid(getBlockAt(x, y, z))) {
      return { x, y, z, nx, ny, nz,
        px: origin.x+dir.x*t, py: origin.y+dir.y*t, pz: origin.z+dir.z*t, dist: t };
    }
    if (tMaxX < tMaxY && tMaxX < tMaxZ) { x += stepX; t = tMaxX; tMaxX += tDeltaX; nx=-stepX; ny=0; nz=0; }
    else if (tMaxY < tMaxZ) { y += stepY; t = tMaxY; tMaxY += tDeltaY; nx=0; ny=-stepY; nz=0; }
    else { z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; nx=0; ny=0; nz=-stepZ; }
  }
  return null;
}

/* ==================== INTERACTION ==================== */
function breakBlock() {
  if (!isGameStarted || isPaused()) return;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const hit = raycastVoxel(camera.position, dir, 6);
  if (!hit) { showToast("لا يوجد مكعب أمامك"); return; }
  // ✅ إصلاح #7: bedrock لا يُكسر
  if (getBlockAt(hit.x, hit.y, hit.z) === BLOCK.BEDROCK) {
    showToast("⛔ هذه طبقة أساسية لا تُكسر");
    return;
  }
  setBlockAt(hit.x, hit.y, hit.z, AIR);
  showToast("⛏ تم كسر المكعب");
}
function buildBlock() {
  if (!isGameStarted || isPaused()) return;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const hit = raycastVoxel(camera.position, dir, 6);
  if (!hit) return;
  const bx = hit.x + hit.nx, by = hit.y + hit.ny, bz = hit.z + hit.nz;
  if (by < 0 || by >= WORLD_HEIGHT) return;
  if (getBlockAt(bx, by, bz) !== AIR) return;
  if (blockWouldHitPlayer(bx, by, bz)) { showToast("لا يمكن البناء داخل نفسك"); return; }
  if (setBlockAt(bx, by, bz, selectedBlockType)) showToast("🧱 تم البناء");
}

/* ==================== STATE HELPERS ==================== */
function isPaused() {
  return !pauseMenu.classList.contains("hidden") ||
         !settingsMenu.classList.contains("hidden") ||
         !mainMenu.classList.contains("hidden");
}
function resetMovement() {
  moveState.forward = 0; moveState.backward = 0;
  moveState.left = 0; moveState.right = 0; moveState.jump = false;
}

function saveWorld() {
  try {
    const mods = {};
    for (const [ckey, m] of chunkMods) {
      const obj = {};
      for (const [bkey, t] of m) obj[bkey] = t;
      mods[ckey] = obj;
    }
    localStorage.setItem("IMADCRAFT_SAVE_V2", JSON.stringify({
      version: 2,
      player: { x: player.pos.x, y: player.pos.y, z: player.pos.z, yaw, pitch },
      selected: selectedBlockType, mods, settings: { ...gameSettings }
    }));
    hasUnsavedChanges = false;
    showToast("💾 تم حفظ العالم");
  } catch (e) { showToast("تعذر الحفظ"); }
}

// ✅ إصلاح #1 و #2: لا يوجد forceGenerateChunk قبل loadWorld، وتُطبَّق التعديلات على القطع الموجودة
function loadWorld() {
  try {
    const raw = localStorage.getItem("IMADCRAFT_SAVE_V2");
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (data.player) {
      player.pos.set(data.player.x, data.player.y, data.player.z);
      yaw = data.player.yaw || 0;
      pitch = data.player.pitch || 0;
    }
    if (typeof data.selected === "number") selectedBlockType = data.selected;
    if (data.mods) {
      chunkMods.clear();
      for (const ckey in data.mods) {
        const m = new Map();
        for (const bkey in data.mods[ckey]) m.set(bkey, data.mods[ckey][bkey]);
        chunkMods.set(ckey, m);
      }
    }
    // ✅ إصلاح #2: طبّق التعديلات على القطع الموجودة مسبقاً
    for (const [ckey, mods] of chunkMods) {
      const chunk = chunks.get(ckey);
      if (chunk) {
        for (const [bkey, t] of mods) {
          const [lx, ly, lz] = bkey.split(',').map(Number);
          chunk.set(lx, ly, lz, t);
        }
        rebuildChunk(chunk);
      }
    }
    return true;
  } catch (e) { return false; }
}

function isTouchDevice() {
  return ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
}

/* ==================== UI ELEMENTS ==================== */
const mainMenu     = document.getElementById("main-menu");
const settingsMenu = document.getElementById("settings-menu");
const pauseMenu    = document.getElementById("pause-menu");
const btnCamera    = document.getElementById("btn-camera");
const btnPause     = document.getElementById("btn-pause");
const btnSave      = document.getElementById("btn-save");

/* ==================== START GAME ==================== */
function startGame() {
  mainMenu.classList.add("hidden");
  settingsMenu.classList.add("hidden");
  pauseMenu.classList.add("hidden");
  isGameStarted = true;

  const loaded = loadWorld();

  const pcx = Math.floor(player.pos.x / CHUNK_SIZE);
  const pcz = Math.floor(player.pos.z / CHUNK_SIZE);
  for (let dx = -1; dx <= 1; dx++)
    for (let dz = -1; dz <= 1; dz++)
      forceGenerateChunk(pcx + dx, pcz + dz);

  requestChunksAround(player.pos.x, player.pos.z);

  if (!loaded) {
    const bx = Math.floor(player.pos.x), bz = Math.floor(player.pos.z);
    let y = WORLD_HEIGHT - 1;
    while (y > 0 && !isSolid(getBlockAt(bx, y, bz))) y--;
    player.pos.y = y + 1.05;
    player.vel.set(0, 0, 0);
  }

  if (!isTouchDevice()) {
    try { renderer.domElement.requestPointerLock(); } catch (e) {}
  }

  showToast(loaded ? "✅ تم تحميل العالم" : "🌍 عالم جديد");
}

/* ==================== MENU HANDLERS ==================== */
document.getElementById("menu-start").addEventListener("click", startGame);

document.getElementById("menu-settings").addEventListener("click", () => {
  settingsReturnTo = "main";
  mainMenu.classList.add("hidden");
  pauseMenu.classList.add("hidden");
  settingsMenu.classList.remove("hidden");
});

document.getElementById("settings-back").addEventListener("click", () => {
  settingsMenu.classList.add("hidden");
  if (settingsReturnTo === "pause" && isGameStarted) pauseMenu.classList.remove("hidden");
  else mainMenu.classList.remove("hidden");
});

btnPause.addEventListener("click", () => {
  if (!isGameStarted) { showToast("ابدأ اللعبة أولاً"); return; }
  resetMovement();
  if (document.pointerLockElement) document.exitPointerLock();
  pauseMenu.classList.remove("hidden");
});

document.getElementById("pause-resume").addEventListener("click", () => {
  pauseMenu.classList.add("hidden");
  if (!isTouchDevice()) {
    try { renderer.domElement.requestPointerLock(); } catch (e) {}
  }
});

document.getElementById("pause-settings").addEventListener("click", () => {
  settingsReturnTo = "pause";
  pauseMenu.classList.add("hidden");
  settingsMenu.classList.remove("hidden");
});

document.getElementById("pause-save").addEventListener("click", saveWorld);

document.getElementById("pause-exit").addEventListener("click", () => {
  if (hasUnsavedChanges && !confirm("لديك تعديلات غير محفوظة. هل تريد الخروج بدون حفظ؟")) return;
  pauseMenu.classList.add("hidden");
  settingsMenu.classList.add("hidden");
  mainMenu.classList.remove("hidden");
  isGameStarted = false;
  resetMovement();
  if (document.pointerLockElement) document.exitPointerLock();
});

btnSave.addEventListener("click", saveWorld);

btnCamera.addEventListener("click", () => {
  cameraMode = (cameraMode + 1) % 2;
  btnCamera.textContent = cameraMode === 0 ? "👤 منظور 1" : "👤 منظور 3";
  showToast(cameraMode === 0 ? "كاميرا: الشخص الأول" : "كاميرا: الشخص الثالث");
});

/* ==================== HOTBAR ==================== */
const hotbarSlots = document.querySelectorAll('.hotbar-slot');
function selectBlockType(t) {
  selectedBlockType = t;
  hotbarSlots.forEach(s => s.classList.toggle('active', parseInt(s.getAttribute('data-type')) === t));
}
hotbarSlots.forEach(slot => {
  slot.addEventListener('click', () => selectBlockType(parseInt(slot.getAttribute('data-type'))));
});

/* ==================== SETTINGS ==================== */
const settingVolume = document.getElementById("setting-volume");
const settingFog = document.getElementById("setting-fog");
const settingFullscreen = document.getElementById("setting-fullscreen");
const settingSens = document.getElementById("setting-sens");
const settingSpeed = document.getElementById("setting-speed");
const settingRender = document.getElementById("setting-render");
const settingQuality = document.getElementById("setting-quality");
const settingFps = document.getElementById("setting-fps");

settingVolume.addEventListener("input", e => {
  gameSettings.volume = +e.target.value;
  document.getElementById("val-volume").textContent = gameSettings.volume;
});
settingSens.addEventListener("input", e => {
  gameSettings.sensitivity = +e.target.value;
  document.getElementById("val-sens").textContent = gameSettings.sensitivity;
});
settingSpeed.addEventListener("input", e => {
  gameSettings.moveSpeed = +e.target.value;
  document.getElementById("val-speed").textContent = gameSettings.moveSpeed;
});
settingRender.addEventListener("input", e => {
  gameSettings.renderDistance = +e.target.value;
  document.getElementById("val-render").textContent = gameSettings.renderDistance;
  applyFog();
  requestChunksAround(player.pos.x, player.pos.z);
});
settingQuality.addEventListener("input", e => {
  gameSettings.quality = +e.target.value;
  document.getElementById("val-quality").textContent = gameSettings.quality + "%";
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5) * (gameSettings.quality/100));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
settingFog.addEventListener("change", e => {
  gameSettings.fog = e.target.checked;
  applyFog();
});
settingFps.addEventListener("change", e => {
  gameSettings.showFps = e.target.checked;
  document.getElementById("hud-fps").style.display = gameSettings.showFps ? "" : "none";
});
settingFullscreen.addEventListener("change", e => {
  if (e.target.checked) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }
  else { if (document.exitFullscreen) document.exitFullscreen(); }
});

/* ==================== KEYBOARD ==================== */
document.addEventListener("keydown", e => {
  if (!isGameStarted) return;
  switch (e.code) {
    case "KeyW": case "ArrowUp": moveState.forward = 1; break;
    case "KeyS": case "ArrowDown": moveState.backward = 1; break;
    case "KeyA": case "ArrowLeft": moveState.left = 1; break;
    case "KeyD": case "ArrowRight": moveState.right = 1; break;
    case "Space": moveState.jump = true; break;
    case "Escape":
      if (!pauseMenu.classList.contains("hidden")) document.getElementById("pause-resume").click();
      else if (!settingsMenu.classList.contains("hidden")) document.getElementById("settings-back").click();
      else btnPause.click();
      break;
    case "Digit1": selectBlockType(0); break;
    case "Digit2": selectBlockType(1); break;
    case "Digit3": selectBlockType(2); break;
    case "Digit4": selectBlockType(3); break;
    case "Digit5": selectBlockType(4); break;
    case "Digit6": selectBlockType(5); break;
    case "Digit7": selectBlockType(6); break;
    case "Digit8": selectBlockType(7); break;
    case "KeyF": btnCamera.click(); break;
  }
});
document.addEventListener("keyup", e => {
  switch (e.code) {
    case "KeyW": case "ArrowUp": moveState.forward = 0; break;
    case "KeyS": case "ArrowDown": moveState.backward = 0; break;
    case "KeyA": case "ArrowLeft": moveState.left = 0; break;
    case "KeyD": case "ArrowRight": moveState.right = 0; break;
    case "Space": moveState.jump = false; break;
  }
});

/* ==================== MOUSE / TOUCH LOOK ==================== */
let lookPointerId = null;
let lastTouchX = 0, lastTouchY = 0;

renderer.domElement.addEventListener("pointerdown", e => {
  if (!isGameStarted || isPaused()) return;
  if (e.pointerType === "mouse") {
    if (document.pointerLockElement !== renderer.domElement) {
      try { renderer.domElement.requestPointerLock(); } catch (err) {}
    }
  } else if (e.pointerType === "touch" && lookPointerId === null) {
    lookPointerId = e.pointerId;
    lastTouchX = e.clientX; lastTouchY = e.clientY;
  }
});
window.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" && document.pointerLockElement === renderer.domElement) {
    const s = 0.0022 * (gameSettings.sensitivity / 5);
    yaw -= e.movementX * s;
    pitch -= e.movementY * s;
    pitch = clamp(pitch, -Math.PI/2 + 0.02, Math.PI/2 - 0.02);
  } else if (e.pointerId === lookPointerId) {
    const dx = e.clientX - lastTouchX, dy = e.clientY - lastTouchY;
    const s = 0.005 * (gameSettings.sensitivity / 5);
    yaw -= dx * s; pitch -= dy * s;
    pitch = clamp(pitch, -Math.PI/2 + 0.02, Math.PI/2 - 0.02);
    lastTouchX = e.clientX; lastTouchY = e.clientY;
  }
});
window.addEventListener("pointerup", e => { if (e.pointerId === lookPointerId) lookPointerId = null; });
window.addEventListener("pointercancel", e => { if (e.pointerId === lookPointerId) lookPointerId = null; });

renderer.domElement.addEventListener("mousedown", e => {
  if (!isGameStarted || isPaused()) return;
  if (document.pointerLockElement !== renderer.domElement) {
    try { renderer.domElement.requestPointerLock(); } catch (err) {}
    return;
  }
  if (e.button === 0) breakBlock();
  else if (e.button === 2) buildBlock();
});
renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());

/* ==================== VIRTUAL CONTROLS ==================== */
function bindHold(el, onDown, onUp) {
  el.addEventListener("pointerdown", e => { e.preventDefault(); onDown(); });
  el.addEventListener("pointerup", e => { e.preventDefault(); onUp && onUp(); });
  el.addEventListener("pointerleave", () => onUp && onUp());
  el.addEventListener("pointercancel", () => onUp && onUp());
}
bindHold(document.getElementById("btn-up"),    () => moveState.forward = 1,  () => moveState.forward = 0);
bindHold(document.getElementById("btn-down"),  () => moveState.backward = 1, () => moveState.backward = 0);
bindHold(document.getElementById("btn-left"),  () => moveState.left = 1,     () => moveState.left = 0);
bindHold(document.getElementById("btn-right"), () => moveState.right = 1,    () => moveState.right = 0);
bindHold(document.getElementById("btn-jump"),  () => moveState.jump = true,  () => moveState.jump = false);
document.getElementById("btn-break").addEventListener("click", breakBlock);
document.getElementById("btn-build").addEventListener("click", buildBlock);

/* ==================== AUTO-PAUSE & WARN ==================== */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && isGameStarted &&
      pauseMenu.classList.contains("hidden") &&
      settingsMenu.classList.contains("hidden")) {
    resetMovement();
    if (document.pointerLockElement) document.exitPointerLock();
    pauseMenu.classList.remove("hidden");
  }
});
window.addEventListener("beforeunload", e => {
  if (hasUnsavedChanges) { e.preventDefault(); e.returnValue = ""; }
});

/* ==================== RESIZE ==================== */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ==================== MAIN LOOP ==================== */
const clock = new THREE.Clock();
let frames = 0, lastFpsTime = 0;
let lastChunkX = null, lastChunkZ = null;
const fpsEl = document.getElementById("hud-fps");
const coordsEl = document.getElementById("hud-coords");
const chunksEl = document.getElementById("hud-chunks");

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const paused = isPaused();

  if (isGameStarted && !paused) {
    updatePlayer(dt);
    const pcx = Math.floor(player.pos.x / CHUNK_SIZE);
    const pcz = Math.floor(player.pos.z / CHUNK_SIZE);
    if (pcx !== lastChunkX || pcz !== lastChunkZ) {
      lastChunkX = pcx; lastChunkZ = pcz;
      requestChunksAround(player.pos.x, player.pos.z);
    }
    processGenQueue(6);
  } else if (isGameStarted) {
    processGenQueue(4);
  }

  updateCamera();
  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if (now - lastFpsTime >= 500) {
    const fps = Math.round((frames * 1000) / (now - lastFpsTime));
    frames = 0; lastFpsTime = now;
    if (gameSettings.showFps) fpsEl.textContent = `FPS: ${fps}`;
    coordsEl.textContent = `XYZ: ${player.pos.x.toFixed(1)} ${player.pos.y.toFixed(1)} ${player.pos.z.toFixed(1)}`;
    chunksEl.textContent = `Chunks: ${chunks.size}`;
  }
}

/* ==================== BOOT ==================== */
if (!window.THREE) { alert("تعذر تحميل Three.js"); return; }
// ✅ إصلاح #1: تم إزالة forceGenerateChunk قبل loadWorld
// التوليد يحدث الآن داخل startGame بعد loadWorld
updateCamera();
animate();

})();
